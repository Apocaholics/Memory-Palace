<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="app-header">
    <span class="app-name" data-text="appName"></span>
    <button type="button" class="btn btn-secondary" data-action="newDeck" data-text="newDeck"></button>
  </header>

  <main class="app-main">
    <section class="screen" data-screen="start" hidden>
      <div class="screen-body">
        <h1 data-text="appName"></h1>
        <p class="lead" data-text="startLead"></p>
        <ol class="steps">
          <li data-text="step1"></li>
          <li data-text="step2"></li>
          <li data-text="step3"></li>
          <li data-text="step4"></li>
        </ol>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" data-action="newDeck" data-text="newDeck"></button>
      </div>
    </section>

    <section class="screen" data-screen="layout" hidden>
      <div class="screen-body card-stage">
        <p class="position" id="layout-position"></p>
        <div class="card-slot" id="layout-card"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-secondary" data-action="back" data-text="back"></button>
        <button type="button" class="btn btn-primary" data-action="next" data-text="next"></button>
        <button type="button" class="btn btn-primary" data-action="layoutDone" data-text="layoutDone"></button>
      </div>
    </section>
    <section class="screen" data-screen="memorize" hidden>
      <div class="screen-body">
        <p class="instruction" data-text="memorizeText"></p>
      </div>
      <div class="actions actions-stack">
        <button type="button" class="btn btn-secondary" data-action="backToLayout" data-text="backToLayout"></button>
        <button type="button" class="btn btn-primary" data-action="startWriting" data-text="startWriting"></button>
      </div>
    </section>

    <section class="screen" data-screen="write" hidden>
      <div class="screen-body">
        <p class="instruction" data-text="writeText"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" data-action="startCheck" data-text="startCheck"></button>
      </div>
    </section>
    <section class="screen" data-screen="check" hidden>
      <div class="screen-body card-stage">
        <p class="position" id="check-position"></p>
        <div class="card-slot" id="check-card"></div>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-secondary btn-undo" data-action="undo" data-text="undo"></button>
        <button type="button" class="btn btn-mark btn-ok" data-action="mark" data-ok="true" data-text="markOk" data-label="markOkLabel"></button>
        <button type="button" class="btn btn-mark btn-fail" data-action="mark" data-ok="false" data-text="markFail" data-label="markFailLabel"></button>
      </div>
    </section>
    <section class="screen" data-screen="summary" hidden>
      <div class="screen-body">
        <p class="score" id="summary-score"></p>
        <h2 data-text="errorsTitle"></h2>
        <p id="summary-no-errors" data-text="noErrors"></p>
        <ul class="errors" id="summary-errors"></ul>
      </div>
      <div class="actions">
        <button type="button" class="btn btn-primary" data-action="newDeck" data-text="newDeck"></button>
      </div>
    </section>
  </main>

  <dialog class="confirm" id="confirm-new-deck">
    <form method="dialog">
      <p data-text="confirmNewDeck"></p>
      <div class="actions">
        <button type="submit" class="btn btn-secondary" value="cancel" data-text="cancel" autofocus></button>
        <button type="submit" class="btn btn-primary" value="yes" data-text="yes"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
